<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Useful Online Tools</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

:root{
  --bg:#f2f4f7;
  --card:#ffffff;
  --text:#222;
  --muted:#666;
  --border:#ddd;
  --button:#222;
  --buttonText:#fff;
}

body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#f5f5f5;
  --muted:#aaa;
  --border:#444;
  --button:#f5f5f5;
  --buttonText:#111;
}

body{
  background:var(--bg);
  color:var(--text);
  padding:20px;
  transition:.3s;
}

header{
  text-align:center;
  max-width:900px;
  margin:0 auto 25px;
}

header h1{
  font-size:34px;
  margin-bottom:8px;
}

header p{
  color:var(--muted);
}

.top-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:15px;
}

.top-buttons button{
  padding:10px 18px;
}

.search{
  max-width:900px;
  margin:0 auto 20px;
}

.search input{
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:17px;
  background:var(--card);
  color:var(--text);
}

.categories{
  max-width:900px;
  margin:0 auto 25px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.category-btn{
  padding:10px 15px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
}

.category-btn.active{
  background:var(--button);
  color:var(--buttonText);
}

.container{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}

.tool{
  background:var(--card);
  padding:20px;
  border-radius:16px;
  border:1px solid var(--border);
  box-shadow:0 5px 15px rgba(0,0,0,.08);
  transition:.2s;
}

.tool:hover{
  transform:translateY(-3px);
}

.tool h2{
  margin-bottom:15px;
}

input,
select{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:9px;
  font-size:16px;
  margin-bottom:10px;
  background:var(--card);
  color:var(--text);
}

button{
  padding:13px;
  font-size:16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#e9ecef;
  color:#222;
}

body.dark button{
  background:#333;
  color:#fff;
}

button:hover{
  opacity:.85;
}

.generate{
  width:100%;
  background:var(--button);
  color:var(--buttonText);
}

.clear{
  background:#dc3545 !important;
  color:white !important;
}

.equal{
  background:var(--button);
  color:var(--buttonText);
}

#display{
  height:55px;
  font-size:24px;
  text-align:right;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.password-box{
  display:flex;
  gap:8px;
}

.password-box input{
  flex:1;
}

.options label{
  display:block;
  margin:8px 0;
}

#length{
  width:100%;
}

.result{
  text-align:center;
  font-size:23px;
  margin:15px 0;
  min-height:30px;
}

.timer{
  text-align:center;
  font-size:40px;
  font-weight:bold;
  margin:20px 0;
}

.timer-buttons{
  display:flex;
  gap:8px;
}

.timer-buttons button{
  flex:1;
}

.qr-box{
  text-align:center;
  margin-top:15px;
}

#qrcode{
  display:inline-block;
  padding:10px;
  background:white;
}

.hide{
  display:none;
}

footer{
  max-width:900px;
  margin:35px auto 10px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:500px){

  body{
    padding:12px;
  }

  header h1{
    font-size:27px;
  }

  .container{
    grid-template-columns:1fr;
  }

  .tool{
    padding:16px;
  }

  .timer{
    font-size:34px;
  }
}
</style>
</head>

<body>

<header>

<h1>🛠️ Useful Online Tools</h1>

<p>Simple, fast and useful tools in one place</p>

<div class="top-buttons">

<button onclick="toggleDarkMode()" id="darkBtn">
🌙 Dark Mode
</button>

</div>

</header>


<div class="search">

<input
type="text"
id="search"
placeholder="🔎 Search tools..."
oninput="searchTools()">

</div>


<div class="categories">

<button class="category-btn active"
onclick="filterCategory('all',this)">
All
</button>

<button class="category-btn"
onclick="filterCategory('math',this)">
🔢 Math
</button>

<button class="category-btn"
onclick="filterCategory('security',this)">
🔐 Security
</button>

<button class="category-btn"
onclick="filterCategory('time',this)">
⏱️ Time
</button>

<button class="category-btn"
onclick="filterCategory('converter',this)">
📏 Converter
</button>

<button class="category-btn"
onclick="filterCategory('personal',this)">
🎂 Personal
</button>

</div>


<div class="container">


<!-- CALCULATOR -->

<div class="tool" data-category="math">

<h2>🧮 Calculator</h2>

<input id="display" readonly>

<div class="buttons">

<button class="clear"
onclick="clearDisplay()">C</button>

<button onclick="deleteLast()">⌫</button>

<button onclick="addValue('%')">%</button>

<button onclick="addValue('/')">÷</button>

<button onclick="addValue('7')">7</button>
<button onclick="addValue('8')">8</button>
<button onclick="addValue('9')">9</button>
<button onclick="addValue('*')">×</button>

<button onclick="addValue('4')">4</button>
<button onclick="addValue('5')">5</button>
<button onclick="addValue('6')">6</button>
<button onclick="addValue('-')">−</button>

<button onclick="addValue('1')">1</button>
<button onclick="addValue('2')">2</button>
<button onclick="addValue('3')">3</button>
<button onclick="addValue('+')">+</button>

<button onclick="addValue('0')">0</button>
<button onclick="addValue('.')">.</button>

<button class="equal"
onclick="calculate()">=</button>

</div>
</div>


<!-- PASSWORD -->

<div class="tool" data-category="security">

<h2>🔐 Password Generator</h2>

<div class="password-box">

<input id="password"
placeholder="Your password"
readonly>

<button onclick="copyPassword()">📋</button>

</div>

<div class="options">

<label>
Password Length:
<span id="lengthValue">12</span>
</label>

<input
type="range"
id="length"
min="6"
max="30"
value="12"
oninput="updateLength()">

<label>
<input type="checkbox"
id="uppercase" checked>
Uppercase
</label>

<label>
<input type="checkbox"
id="lowercase" checked>
Lowercase
</label>

<label>
<input type="checkbox"
id="numbers" checked>
Numbers
</label>

<label>
<input type="checkbox"
id="symbols" checked>
Symbols
</label>

</div>

<button class="generate"
onclick="generatePassword()">
Generate Password
</button>

</div>


<!-- RANDOM NUMBER -->

<div class="tool" data-category="math">

<h2>🎲 Random Number Generator</h2>

<input
type="number"
id="min"
placeholder="Minimum number">

<input
type="number"
id="max"
placeholder="Maximum number">

<div class="result"
id="randomOut"></div>

<button class="generate"
onclick="randomNum()">
Generate Number
</button>

</div>


<!-- TIMER -->

<div class="tool" data-category="time">

<h2>⏱️ Countdown Timer</h2>

<input
type="number"
id="seconds"
placeholder="Enter seconds"
min="1">

<div class="timer"
id="timerOut">
00:00
</div>

<div class="timer-buttons">

<button onclick="startTimer()">Start</button>
<button onclick="stopTimer()">Stop</button>
<button onclick="resetTimer()">Reset</button>

</div>

</div>


<!-- UNIT CONVERTER -->

<div class="tool" data-category="converter">

<h2>📏 Unit Converter</h2>

<input
type="number"
id="unitValue"
placeholder="Enter value">

<select id="unitType">

<option value="km-miles">
Kilometers → Miles
</option>

<option value="miles-km">
Miles → Kilometers
</option>

<option value="kg-lb">
Kilograms → Pounds
</option>

<option value="lb-kg">
Pounds → Kilograms
</option>

<option value="m-ft">
Meters → Feet
</option>

<option value="ft-m">
Feet → Meters
</option>

<option value="c-f">
Celsius → Fahrenheit
</option>

<option value="f-c">
Fahrenheit → Celsius
</option>

</select>

<div class="result"
id="unitResult"></div>

<button class="generate"
onclick="convertUnit()">
Convert
</button>

</div>


<!-- BMI -->

<div class="tool" data-category="personal">

<h2>⚖️ BMI Calculator</h2>

<input
type="number"
id="weight"
placeholder="Weight in kg">

<input
type="number"
id="height"
placeholder="Height in cm">

<div class="result"
id="bmiResult"></div>

<button class="generate"
onclick="calculateBMI()">
Calculate BMI
</button>

</div>


<!-- AGE -->

<div class="tool" data-category="personal">

<h2>🎂 Age Calculator</h2>

<input
type="date"
id="birthDate">

<div class="result"
id="ageResult"></div>

<button class="generate"
onclick="calculateAge()">
Calculate Age
</button>

</div>


<!-- QR -->

<div class="tool" data-category="security">

<h2>🔳 QR Code Generator</h2>

<input
type="text"
id="qrText"
placeholder="Enter text or website">

<button class="generate"
onclick="generateQR()">
Generate QR Code
</button>

<div class="qr-box">
<div id="qrcode"></div>
</div>

</div>

</div>


<footer>
<p>© 2026 Useful Online Tools</p>
</footer>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

/* DARK MODE */

function toggleDarkMode(){

document.body.classList.toggle("dark");

const dark=
document.body.classList.contains("dark");

localStorage.setItem("darkMode",dark);

document.getElementById("darkBtn").textContent=
dark ? "☀️ Light Mode" : "🌙 Dark Mode";
}

if(localStorage.getItem("darkMode")==="true"){

document.body.classList.add("dark");

document.getElementById("darkBtn").textContent=
"☀️ Light Mode";

}


/* CALCULATOR */

const display=
document.getElementById("display");

function addValue(value){
display.value+=value;
}

function clearDisplay(){
display.value="";
}

function deleteLast(){
display.value=
display.value.slice(0,-1);
}

function calculate(){

try{

if(display.value==="") return;

if(!/^[0-9+\-*/%.() ]+$/.test(display.value)){

display.value="Error";
return;
}

display.value=
Function(
'"use strict";return ('+
display.value+
')'
)();

}catch(error){

display.value="Error";

}

}


/* PASSWORD */

function updateLength(){

document.getElementById("lengthValue")
.textContent=
document.getElementById("length").value;

}

function generatePassword(){

const length=
parseInt(
document.getElementById("length").value
);

let chars="";

if(document.getElementById("uppercase").checked)
chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

if(document.getElementById("lowercase").checked)
chars+="abcdefghijklmnopqrstuvwxyz";

if(document.getElementById("numbers").checked)
chars+="0123456789";

if(document.getElementById("symbols").checked)
chars+="!@#$%^&*()_+-=[]{}|;:,.<>?";

if(chars===""){

alert("Please select at least one option.");
return;

}

let password="";

for(let i=0;i<length;i++){

password+=
chars[
Math.floor(
Math.random()*chars.length
)
];

}

document.getElementById("password")
.value=password;

}

function copyPassword(){

const password=
document.getElementById("password").value;

if(password===""){

alert("First generate a password.");
return;

}

navigator.clipboard.writeText(password)
.then(()=>{
alert("Password copied!");
})
.catch(()=>{
alert("Copy failed.");
});

}


/* RANDOM NUMBER */

function randomNum(){

const min=
parseInt(document.getElementById("min").value);

const max=
parseInt(document.getElementById("max").value);

const output=
document.getElementById("randomOut");

if(isNaN(min)||isNaN(max)||min>max){

output.textContent=
"Enter valid numbers";

return;

}

const number=
Math.floor(
Math.random()*(max-min+1)
)+min;

output.textContent=
"Number: "+number;

}


/* TIMER */

let timer;
let remaining=0;

function startTimer(){

const input=
parseInt(
document.getElementById("seconds").value
);

if(isNaN(input)||input<=0){

alert("Enter valid seconds.");
return;

}

if(remaining<=0)
remaining=input;

clearInterval(timer);

showTime();

timer=setInterval(function(){

remaining--;

showTime();

if(remaining<=0){

clearInterval(timer);

document.getElementById("timerOut")
.textContent="⏰ Time Up!";

}

},1000);

}

function showTime(){

const minutes=
Math.floor(remaining/60);

const seconds=
remaining%60;

document.getElementById("timerOut")
.textContent=
String(minutes).padStart(2,"0")
+":"
+
String(seconds).padStart(2,"0");

}

function stopTimer(){
clearInterval(timer);
}

function resetTimer(){

clearInterval(timer);

remaining=0;

document.getElementById("timerOut")
.textContent="00:00";

}


/* UNIT CONVERTER */

function convertUnit(){

const value=
parseFloat(
document.getElementById("unitValue").value
);

const type=
document.getElementById("unitType").value;

const result=
document.getElementById("unitResult");

if(isNaN(value)){

result.textContent="Enter a value";
return;

}

let answer;

if(type==="km-miles")
answer=value*0.621371;

else if(type==="miles-km")
answer=value*1.609344;

else if(type==="kg-lb")
answer=value*2.20462;

else if(type==="lb-kg")
answer=value*0.453592;

else if(type==="m-ft")
answer=value*3.28084;

else if(type==="ft-m")
answer=value*0.3048;

else if(type==="c-f")
answer=(value*9/5)+32;

else if(type==="f-c")
answer=(value-32)*5/9;

result.textContent=
"Result: "+answer.toFixed(2);

}


/* BMI */

function calculateBMI(){

const weight=
parseFloat(
document.getElementById("weight").value
);

const height=
parseFloat(
document.getElementById("height").value
);

const result=
document.getElementById("bmiResult");

if(isNaN(weight)||isNaN(height)||height<=0){

result.textContent="Enter valid values";
return;

}

const heightM=height/100;

const bmi=
weight/(heightM*heightM);

let category;

if(bmi<18.5)
category="Underweight";

else if(bmi<25)
category="Normal";

else if(bmi<30)
category="Overweight";

else
category="Obese";

result.textContent=
"BMI: "+
bmi.toFixed(1)+
" ("+
category+
")";

}


/* AGE */

function calculateAge(){

const birth=
document.getElementById("birthDate").value;

const result=
document.getElementById("ageResult");

if(!birth){

result.textContent=
"Select your birth date";

return;

}

const birthDate=
new Date(birth);

const today=
new Date();

let age=
today.getFullYear()-
birthDate.getFullYear();

const month=
today.getMonth()-
birthDate.getMonth();

if(
month<0 ||
(
month===0 &&
today.getDate()<birthDate.getDate()
)
){

age--;

}

result.textContent=
"Your age: "+age+" years";

}


/* QR */

function generateQR(){

const text=
document.getElementById("qrText").value;

const box=
document.getElementById("qrcode");

box.innerHTML="";

if(text.trim()===""){

alert("Enter text or website.");
return;

}

new QRCode(box,{

text:text,
width:180,
height:180

});

}


/* CATEGORY FILTER */

function filterCategory(category,button){

document
.querySelectorAll(".category-btn")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

document
.querySelectorAll(".tool")
.forEach(tool=>{

if(
category==="all" ||
tool.dataset.category===category
){

tool.classList.remove("hide");

}else{

tool.classList.add("hide");

}

});

document.getElementById("search").value="";

}


/* SEARCH */

function searchTools(){

const search=
document.getElementById("search")
.value
.toLowerCase();

document
.querySelectorAll(".tool")
.forEach(card=>{

const text=
card.innerText.toLowerCase();

if(text.includes(search)){

card.classList.remove("hide");

}else{

card.classList.add("hide");

}

});

}

</script>

</body>
</html>
