<script>

function wordCount(){
  let t=document.getElementById("wc").value;
  document.getElementById("words").innerText =
    t.trim()==="" ? 0 : t.trim().split(/\s+/).length;
  document.getElementById("chars").innerText=t.length;
}

function upper(){
  document.getElementById("caseOut").innerText =
    document.getElementById("caseIn").value.toUpperCase();
}

function lower(){
  document.getElementById("caseOut").innerText =
    document.getElementById("caseIn").value.toLowerCase();
}

function reverseText(){
  document.getElementById("revOut").innerText =
    [...document.getElementById("revIn").value].reverse().join("");
}

function calculate(){
  let x=document.getElementById("calc").value;

  if(!/^[0-9+\-*/().%\s]+$/.test(x)){
    document.getElementById("calcOut").innerText="Invalid calculation";
    return;
  }

  try{
    let result=Function("return ("+x+")")();
    document.getElementById("calcOut").innerText="Result: "+result;
  }catch{
    document.getElementById("calcOut").innerText="Invalid calculation";
  }
}

function ageCalc(){
  let value=document.getElementById("dob").value;

  if(!value){
    document.getElementById("ageOut").innerText="Select your birth date";
    return;
  }

  let dob=new Date(value);
  let today=new Date();

  let age=today.getFullYear()-dob.getFullYear();

  if(
    today.getMonth()<dob.getMonth() ||
    (today.getMonth()==dob.getMonth() &&
     today.getDate()<dob.getDate())
  ){
    age--;
  }

  document.getElementById("ageOut").innerText=
    "Age: "+age+" years";
}

function bmi(){
  let w=parseFloat(document.getElementById("weight").value);
  let h=parseFloat(document.getElementById("height").value)/100;

  if(w<=0 || h<=0){
    document.getElementById("bmiOut").innerText=
      "Enter valid values";
    return;
  }

  let result=w/(h*h);

  document.getElementById("bmiOut").innerText=
    "BMI: "+result.toFixed(1);
}

function tipCalc(){
  let bill=parseFloat(document.getElementById("bill").value);
  let tip=parseFloat(document.getElementById("tip").value);

  if(isNaN(bill)||isNaN(tip)){
    document.getElementById("tipOut").innerText=
      "Enter valid values";
    return;
  }

  let total=bill+(bill*tip/100);

  document.getElementById("tipOut").innerText=
    "Total: "+total.toFixed(2);
}

function passwordGen(){

  let chars=
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

  let password="";

  for(let i=0;i<14;i++){
    password+=chars[
      Math.floor(Math.random()*chars.length)
    ];
  }

  document.getElementById("passOut").innerText=
    password;
}

function randomNum(){

  let min=parseInt(
    document.getElementById("min").value
  );

  let max=parseInt(
    document.getElementById("max").value
  );

  if(isNaN(min)||isNaN(max)||min>max){
    document.getElementById("randomOut").innerText=
      "Enter valid numbers";
    return;
  }

  let number=
    Math.floor(Math.random()*(max-min+1))+min;

  document.getElementById("randomOut").innerText=
    "Number: "+number;
}

let timer;
let remaining=0;

function startTimer(){

  remaining=parseInt(
    document.getElementById("seconds").value
  );

  if(isNaN(remaining)||remaining<=0)return;

  clearInterval(timer);

  timer=setInterval(function(){

    let minutes=Math.floor(remaining/60);
    let seconds=remaining%60;

    document.getElementById("timerOut").innerText=
      String(minutes).padStart(2,"0")+":"+
      String(seconds).padStart(2,"0");

    remaining--;

    if(remaining<0){
      clearInterval(timer);
      document.getElementById("timerOut").innerText=
        "⏰ Time Up!";
    }

  },1000);
}

function stopTimer(){
  clearInterval(timer);
}

function searchTools(){

  let search=
    document.getElementById("search").value.toLowerCase();

  document.querySelectorAll(".tool").forEach(function(card){

    let text=card.innerText.toLowerCase();

    if(text.includes(search)){
      card.classList.remove("hide");
    }else{
      card.classList.add("hide");
    }

  });
}

function filterTools(category,button){

  document.querySelectorAll(".categories button")
  .forEach(function(b){
    b.classList.remove("active");
  });

  button.classList.add("active");

  document.getElementById("search").value="";

  document.querySelectorAll(".tool")
  .forEach(function(card){

    if(category==="all" ||
       card.dataset.cat===category){

      card.classList.remove("hide");

    }else{

      card.classList.add("hide");

    }

  });
}

</script>
</body>
</html>
