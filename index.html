<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Useful Online Tools</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
  transition:0.3s;
}

body.dark{
  background:#121212;
  color:#eee;
}

header{
  text-align:center;
  padding:30px 15px 20px;
}

header h1{
  font-size:42px;
  margin:0 0 10px;
}

header p{
  color:#666;
  font-size:20px;
}

.dark header p{
  color:#aaa;
}

.top-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:20px 0;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-size:16px;
  cursor:pointer;
  background:#222;
  color:white;
  transition:0.2s;
}

button:hover{
  transform:translateY(-2px);
  opacity:0.9;
}

.dark-btn{
  background:#333;
  font-size:18px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:10px 20px 50px;
}

.search{
  width:100%;
  padding:20px;
  border:2px solid #ddd;
  border-radius:18px;
  font-size:20px;
  margin:20px 0;
  outline:none;
}

.dark .search,
.dark input,
.dark select{
  background:#222;
  color:#eee;
  border-color:#444;
}

.categories{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin:20px 0 35px;
}

.categories button{
  background:white;
  color:#222;
  border:2px solid #ddd;
  font-size:17px;
}

.categories button.active{
  background:#222;
  color:white;
}

.dark .categories button{
  background:#222;
  color:#eee;
  border-color:#444;
}

.dark .categories button.active{
  background:white;
  color:#222;
}

.tools{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px;
}

.tool{
  background:white;
  border-radius:22px;
  padding:25px;
  box-shadow:0 3px 12px rgba(0,0,0,0.08);
  border:1px solid #ddd;
}

.dark .tool{
  background:#1e1e1e;
  border-color:#333;
}

.tool h2{
  margin-top:0;
  font-size:28px;
}

.tool input,
.tool select{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:17px;
}

.result{
  margin-top:12px;
  padding:14px;
  background:#f1f3f5;
  border-radius:10px;
  font-size:18px;
  min-height:25px;
}

.dark .result{
  background:#292929;
}

.small-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.small-buttons button{
  flex:1;
}

.reset{
  background:#777;
}

.copy{
  background:#087f5b;
}

.calc-display{
  width:100%;
  padding:18px;
  font-size:26px;
  text-align:right;
  border:2px solid #ddd;
  border-radius:12px;
  margin-bottom:12px;
}

.calc-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.calc-buttons button{
  padding:18px 5px;
  font-size:20px;
  background:#e9ecef;
  color:#222;
}

.calc-buttons button.operator{
  background:#333;
  color:white;
}

.calc-buttons button.clear{
  background:#dc3545;
  color:white;
}

#qrcode{
  margin-top:15px;
  padding:10px;
  background:white;
  display:inline-block;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#777;
}

.back-top{
  position:fixed;
  right:20px;
  bottom:20px;
  width:50px;
  height:50px;
  border-radius:50%;
  display:none;
  padding:0;
  font-size:22px;
  z-index:99;
}

.hidden{
  display:none !important;
}

@media(max-width:700px){

  header h1{
    font-size:32px;
  }

  header p{
    font-size:17px;
  }

  .container{
    padding:5px 12px 40px;
  }

  .tools{
    grid-template-columns:1fr;
  }

  .tool{
    padding:18px;
  }

  .tool h2{
    font-size:25px;
  }

  .categories button{
    padding:11px 15px;
  }

  .search{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header>

<h1>🛠️ Useful Online Tools</h1>

<p>Simple, fast and useful tools in one place</p>

<div class="top-buttons">
<button class="dark-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
</div>

</header>

<div class="container">

<input
class="search"
id="search"
type="text"
placeholder="🔎 Search tools..."
oninput="searchTools()"
>

<div class="categories">

<button class="active" onclick="filterCategory('all',this)">All</button>
<button onclick="filterCategory('math',this)">🔢 Math</button>
<button onclick="filterCategory('security',this)">🔐 Security</button>
<button onclick="filterCategory('time',this)">⏱️ Time</button>
<button onclick="filterCategory('converter',this)">📏 Converter</button>
<button onclick="filterCategory('personal',this)">🎂 Personal</button>

</div>

<div class="tools">

<!-- Calculator -->

<div class="tool" data-category="math" data-name="calculator">

<h2>🧮 Calculator</h2>

<input id="calcDisplay" class="calc-display" readonly>

<div class="calc-buttons">

<button class="clear" onclick="clearCalc()">C</button>
<button onclick="backspace()">⌫</button>
<button onclick="calcInput('%')">%</button>
<button class="operator" onclick="calcInput('/')">÷</button>

<button onclick="calcInput('7')">7</button>
<button onclick="calcInput('8')">8</button>
<button onclick="calcInput('9')">9</button>
<button class="operator" onclick="calcInput('*')">×</button>

<button onclick="calcInput('4')">4</button>
<button onclick="calcInput('5')">5</button>
<button onclick="calcInput('6')">6</button>
<button class="operator" onclick="calcInput('-')">−</button>

<button onclick="calcInput('1')">1</button>
<button onclick="calcInput('2')">2</button>
<button onclick="calcInput('3')">3</button>
<button class="operator" onclick="calcInput('+')">+</button>

<button onclick="calcInput('0')">0</button>
<button onclick="calcInput('.')">.</button>
<button onclick="calculate()">=</button>

</div>

</div>


<!-- Password -->

<div class="tool" data-category="security" data-name="password generator">

<h2>🔐 Password Generator</h2>

<input id="passwordLength" type="number" value="12" min="4" max="50">

<div class="small-buttons">

<button onclick="generatePassword()">Generate</button>
<button class="copy" onclick="copyText('passwordResult')">📋 Copy</button>

</div>

<div id="passwordResult" class="result"></div>

</div>


<!-- Random Number -->

<div class="tool" data-category="math" data-name="random number generator">

<h2>🎲 Random Number</h2>

<input id="minNumber" type="number" placeholder="Minimum">

<input id="maxNumber" type="number" placeholder="Maximum">

<button onclick="randomNumber()">Generate</button>

<div id="randomResult" class="result"></div>

</div>


<!-- Timer -->

<div class="tool" data-category="time" data-name="countdown timer">

<h2>⏱️ Countdown Timer</h2>

<input id="timerInput" type="number" placeholder="Seconds">

<div class="small-buttons">

<button onclick="startTimer()">Start</button>
<button class="reset" onclick="resetTimer()">Reset</button>

</div>

<div id="timerResult" class="result">00:00</div>

</div>


<!-- Unit Converter -->

<div class="tool" data-category="converter" data-name="unit converter">

<h2>📏 Unit Converter</h2>

<input id="unitValue" type="number" placeholder="Enter value">

<select id="unitType">

<option value="km">Kilometers → Miles</option>
<option value="miles">Miles → Kilometers</option>
<option value="kg">Kilograms → Pounds</option>
<option value="pounds">Pounds → Kilograms</option>

</select>

<button onclick="convertUnit()">Convert</button>

<div id="unitResult" class="result"></div>

</div>


<!-- BMI -->

<div class="tool" data-category="personal" data-name="bmi calculator">

<h2>⚖️ BMI Calculator</h2>

<input id="weight" type="number" placeholder="Weight (kg)">

<input id="height" type="number" placeholder="Height (cm)">

<button onclick="calculateBMI()">Calculate BMI</button>

<div id="bmiResult" class="result"></div>

</div>


<!-- Age -->

<div class="tool" data-category="personal" data-name="age calculator">

<h2>🎂 Age Calculator</h2>

<input id="birthDate" type="date">

<button onclick="calculateAge()">Calculate Age</button>

<div id="ageResult" class="result"></div>

</div>


<!-- QR -->

<div class="tool" data-category="security" data-name="qr code generator">

<h2>📱 QR Code Generator</h2>

<input id="qrText" type="text" placeholder="Enter text or URL">

<button onclick="generateQR()">Generate QR</button>

<div id="qrcode"></div>

</div>

</div>

</div>

<footer>

© 2026 Useful Online Tools<br>
Made with ❤️ using HTML, CSS & JavaScript

</footer>

<button class="back-top" id="backTop" onclick="window.scrollTo(0,0)">↑</button>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

/* DARK MODE */

function toggleDarkMode(){

document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){
localStorage.setItem("darkMode","on");
}else{
localStorage.setItem("darkMode","off");
}

}

if(localStorage.getItem("darkMode")==="on"){
document.body.classList.add("dark");
}


/* CALCULATOR */

let calc="";

function calcInput(value){

calc += value;
document.getElementById("calcDisplay").value=calc;

}

function clearCalc(){

calc="";
document.getElementById("calcDisplay").value="";

}

function backspace(){

calc=calc.slice(0,-1);
document.getElementById("calcDisplay").value=calc;

}

function calculate(){

try{

calc=String(eval(calc));
document.getElementById("calcDisplay").value=calc;

}catch{

document.getElementById("calcDisplay").value="Error";
calc="";

}

}


/* PASSWORD */

function generatePassword(){

let length=parseInt(document.getElementById("passwordLength").value);

let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

let password="";

for(let i=0;i<length;i++){

password += chars.charAt(Math.floor(Math.random()*chars.length));

}

document.getElementById("passwordResult").textContent=password;

}


/* RANDOM NUMBER */

function randomNumber(){

let min=parseInt(document.getElementById("minNumber").value);
let max=parseInt(document.getElementById("maxNumber").value);

if(isNaN(min)||isNaN(max)){

document.getElementById("randomResult").textContent="Please enter both numbers.";
return;

}

if(min>max){

[min,max]=[max,min];

}

let number=Math.floor(Math.random()*(max-min+1))+min;

document.getElementById("randomResult").textContent=number;

}


/* TIMER */

let timerInterval;

function startTimer(){

clearInterval(timerInterval);

let seconds=parseInt(document.getElementById("timerInput").value);

if(isNaN(seconds)||seconds<=0){

alert("Please enter seconds.");
return;

}

timerInterval=setInterval(function(){

let min=Math.floor(seconds/60);
let sec=seconds%60;

document.getElementById("timerResult").textContent=
String(min).padStart(2,"0")+":"+
String(sec).padStart(2,"0");

seconds--;

if(seconds<0){

clearInterval(timerInterval);
document.getElementById("timerResult").textContent="Time Up! 🔔";

}

},1000);

}

function resetTimer(){

clearInterval(timerInterval);

document.getElementById("timerResult").textContent="00:00";
document.getElementById("timerInput").value="";

}


/* UNIT CONVERTER */

function convertUnit(){

let value=parseFloat(document.getElementById("unitValue").value);
let type=document.getElementById("unitType").value;
let result;

if(isNaN(value)){

document.getElementById("unitResult").textContent="Please enter a value.";
return;

}

if(type==="km"){
result=value*0.621371+" miles";
}

if(type==="miles"){
result=value*1.60934+" km";
}

if(type==="kg"){
result=value*2.20462+" pounds";
}

if(type==="pounds"){
result=value*0.453592+" kg";
}

document.getElementById("unitResult").textContent=result;

}


/* BMI */

function calculateBMI(){

let weight=parseFloat(document.getElementById("weight").value);
let height=parseFloat(document.getElementById("height").value);

if(isNaN(weight)||isNaN(height)||height<=0){

document.getElementById("bmiResult").textContent="Please enter valid values.";
return;

}

let bmi=weight/((height/100)*(height/100));

let status="";

if(bmi<18.5) status="Underweight";
else if(bmi<25) status="Normal";
else if(bmi<30) status="Overweight";
else status="Obesity";

document.getElementById("bmiResult").textContent=
"BMI: "+bmi.toFixed(2)+" — "+status;

}


/* AGE */

function calculateAge(){

let birth=document.getElementById("birthDate").value;

if(!birth){

document.getElementById("ageResult").textContent="Please select your birth date.";
return;

}

let birthDate=new Date(birth);
let today=new Date();

let age=today.getFullYear()-birthDate.getFullYear();

let month=today.getMonth()-birthDate.getMonth();

if(month<0 || (month===0 && today.getDate()<birthDate.getDate())){
age--;
}

document.getElementById("ageResult").textContent=
"Your age is "+age+" years.";

}


/* QR CODE */

function generateQR(){

let text=document.getElementById("qrText").value;

let qr=document.getElementById("qrcode");

qr.innerHTML="";

if(!text){

qr.innerHTML="<p>Please enter text or URL.</p>";
return;

}

new QRCode(qr,{

text:text,
width:180,
height:180

});

}


/* COPY */

function copyText(id){

let text=document.getElementById(id).textContent;

if(!text){

alert("Nothing to copy.");
return;

}

navigator.clipboard.writeText(text).then(function(){

alert("Copied! ✅");

});

}


/* CATEGORY */

function filterCategory(category,button){

document.querySelectorAll(".categories button")
.forEach(btn=>btn.classList.remove("active"));

button.classList.add("active");

document.querySelectorAll(".tool").forEach(tool=>{

if(category==="all" || tool.dataset.category===category){

tool.classList.remove("hidden");

}else{

tool.classList.add("hidden");

}

});

}


/* SEARCH */

function searchTools(){

let search=document.getElementById("search").value.toLowerCase();

document.querySelectorAll(".tool").forEach(tool=>{

let name=tool.dataset.name.toLowerCase();

if(name.includes(search)){

tool.classList.remove("hidden");

}else{

tool.classList.add("hidden");

}

});

}


/* BACK TO TOP */

window.addEventListener("scroll",function(){

let btn=document.getElementById("backTop");

if(window.scrollY>400){

btn.style.display="block";

}else{

btn.style.display="none";

}

});

</script>

</body>
</html>
